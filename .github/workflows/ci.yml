name: Application checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'playwright*.ts'
      - 'tsconfig*.json'
      - '.github/workflows/**'
      - '.prettier*'
      - 'compose.yaml'
      - 'compose.production.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'ops/**'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'playwright*.ts'
      - 'tsconfig*.json'
      - '.github/workflows/**'
      - '.prettier*'
      - 'compose.yaml'
      - 'compose.production.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'ops/**'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chinese fonts for poster rendering and layout verification
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra fontconfig
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify native compatibility evidence files
        run: node scripts/check-mini-layout-evidence.mjs
      - name: Preserve native template compatibility layouts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mini-program-layouts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  api:
    runs-on: ubuntu-latest
    # C05 adds commercial, group and media flows in both isolated browser projects.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: scb
          POSTGRES_PASSWORD: ci-isolated-test-password
          POSTGRES_DB: scb_test_application
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U scb -d scb_test_application"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://scb:ci-isolated-test-password@127.0.0.1:5432/scb_test_application
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chinese fonts for actual poster rasterization
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig
      - name: Prepare exact PostgreSQL archive clients and isolated restore role
        run: |
          node --test scripts/ci-postgres-clients.test.mjs
          node scripts/prepare-ci-postgres-clients.mjs
      - name: Verify complete isolated migration chain before running dependent suites
        id: schema_preflight
        run: node --import tsx scripts/check-migrations.mjs
      - name: Existing PostgreSQL integration checks
        run: npm run test:integration --workspace @small-city-basketball/api -- --exclude '**/p07-*.integration.test.ts'
      # The page suite owns separate child databases. Collect its failures even when
      # an integration test fails; that failed step still makes the job fail.
      - id: api_build
        if: ${{ !cancelled() && steps.schema_preflight.outcome == 'success' }}
        run: npm run build --workspace @small-city-basketball/api
      - name: Native mini program pages against the real API
        if: ${{ !cancelled() && steps.api_build.outcome == 'success' }}
        run: npm run test:wechat:api
      - name: Capture sessions, scoring, standings and public identities
        run: node scripts/check-database-restart.mjs capture
        env:
          SCB_PERSISTENCE_FILE: ${{ runner.temp }}/application-restart-state.json
      - name: Restart isolated PostgreSQL
        env:
          SCB_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker restart "$SCB_POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$SCB_POSTGRES_CONTAINER" pg_isready -U scb -d scb_test_application; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify registration, scoring and public viewing after restart
        run: node scripts/check-database-restart.mjs verify
        env:
          SCB_PERSISTENCE_FILE: ${{ runner.temp }}/application-restart-state.json
      - name: Create isolated browser check control database
        run: node --input-type=module -e "import pg from 'pg'; const p=new pg.Pool({connectionString:process.env.TEST_DATABASE_URL}); try { await p.query('CREATE DATABASE scb_test_browser'); } finally { await p.end(); }"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:api:e2e
        env:
          DATABASE_URL: postgresql://scb:ci-isolated-test-password@127.0.0.1:5432/scb_test_browser
      - name: Verify owned browser database cleanup on child failure
        run: node scripts/check-browser-database-isolation.mjs
        env:
          DATABASE_URL: postgresql://scb:ci-isolated-test-password@127.0.0.1:5432/scb_test_browser

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install local CA trust tooling
        run: sudo apt-get install -y libnss3-tools
      - name: Build and verify isolated HTTPS package and full recovery
        run: npm run test:production
