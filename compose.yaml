services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: scb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random POSTGRES_PASSWORD in .env}
      POSTGRES_DB: small_city_basketball
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scb -d small_city_basketball']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
